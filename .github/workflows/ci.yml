name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ clang

      - name: Build
        run: |
          mkdir -p build
          cd build
          cmake ..
          cmake --build . -j$(nproc)

      - name: Run test suite
        run: |
          chmod +x tests/run_tests.sh
          BERY_BIN=./build/bery tests/run_tests.sh